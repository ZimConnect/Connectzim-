<!DOCTYPE html>
<html>
<head>
  <title>ZimConnect Radio 263 - DJ Tewe</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; padding: 20px; }
    .radio-box { background: #004d00; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 500px; }
    .play-btn { background: #ffcc00; color: black; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    .play-btn:hover { background: #ffd633; }
  </style>
</head>
<body>
  <h1>ZimConnect Radio 263</h1>
  <h3 style="color: #ffcc00;">Hosted by DJ Tewe 🔥</h3>
  
  <div class="radio-box">
    <h2>🔴 LIVE NOW</h2>
    <p>Street Gear Sessions with DJ Tewe</p>
    <audio id="radioPlayer" controls style="width: 100%; margin-top: 10px;">
      <source src="https://stream.zeno.fm/0r0a792kwzshx" type="audio/mpeg">
      Your browser does not support audio
    </audio>
    <button class="play-btn" onclick="document.getElementById('radioPlayer').play()">PLAY RADIO</button>
  </div>

  <p>Listen 24/7 on ZimConnect</p>
</body>
</html>
