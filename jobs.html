<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - ZimConnect</title>
  <link rel="icon" href="icon-512.png" type="image/png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:#000;color:#fff;padding:20px 20px 80px 20px}
    header{background:linear-gradient(90deg,#FFD700,#FF0000);color:#000;padding:15px;text-align:center;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
    header img{width:30px;height:30px;border-radius:8px}
    .card{background:#111;margin:15px 0;padding:15px;border-radius:12px;border:1px solid #333}
    .btn{background:linear-gradient(90deg,#FFD700,#FF0000);color:#000;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
    input,textarea{width:100%;padding:10px;margin:5px 0;background:#222;border:1px solid #444;border-radius:6px;color:#fff}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);padding:20px;overflow-y:auto}
    .modal.active{display:block}
    nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #FFD700}
    nav a{color:#aaa;text-decoration:none;font-size:11px;text-align:center}
    nav a.active{color:#FFD700}
  </style>
</head>
<body>
  <header><img src="icon-512.png"> ZIMCONNECT JOBS</header>

  <div id="jobsList"></div>
  <button class="btn" onclick="document.getElementById('jobModal').classList.add('active')">+ Post a Job</button>

  <!-- POST JOB MODAL -->
  <div id="jobModal" class="modal">
    <h2 style="color:#FFD700">Post a Job</h2>
    <input id="jobTitle" placeholder="Job Title">
    <input id="jobCompany" placeholder="Company">
    <input id="jobLocation" placeholder="Location e.g Harare">
    <input id="jobSalary" placeholder="Salary e.g $500">
    <textarea id="jobDesc" placeholder="Job Description"></textarea>
    <button class="btn" onclick="postJob()">Post Job</button>
    <button class="btn" style="background:#333;color:#fff" onclick="document.getElementById('jobModal').classList.remove('active')">Cancel</button>
  </div>

  <nav>
    <a href="index.html">🏠<br>Home</a>
    <a href="jobs.html" class="active">💼<br>Jobs</a>
    <a href="events.html">📅<br>Events</a>
    <a href="tv.html">📺<br>TV</a>
    <a href="podcast.html">🎙️<br>Podcast</a>
  </nav>

  <!-- FIREBASE CODE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "PASTE-YOURS",
      authDomain: "zimconnect.firebaseapp.com",
      projectId: "zimconnect",
      storageBucket: "zimconnect.appspot.com",
      messagingSenderId: "123",
      appId: "1:123:web:abc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // LOAD JOBS
    async function loadJobs(){
      const q = query(collection(db, "jobs"), orderBy("created", "desc"));
      const snap = await getDocs(q);
      let html = "<h2 style='color:#FFD700'>Jobs in Zimbabwe</h2>";
      snap.forEach(doc => {
        const j = doc.data();
        html += `
        <div class="card">
          <h3>${j.title}</h3>
          <p><b>${j.company}</b> | ${j.location}</p>
          <p>${j.salary}</p>
          <p style="color:#aaa;font-size:14px">${j.desc}</p>
          <button class="btn">Apply Now</button>
        </div>`;
      });
      document.getElementById("jobsList").innerHTML = html;
    }
    loadJobs();

    // POST JOB
    window.postJob = async function(){
      await addDoc(collection(db, "jobs"), {
        title: jobTitle.value,
        company: jobCompany.value,
        location: jobLocation.value,
        salary: jobSalary.value,
        desc: jobDesc.value,
        created: new Date()
      });
      alert("Job Posted!");
      document.getElementById('jobModal').classList.remove('active');
      loadJobs();
    }
  </script>
</body>
</html>
