<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZimConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} 
body{font-family:Arial;background:linear-gradient(135deg,#009A49 0%,#FFD700 50%,#D21034 100%);min-height:100vh;color:#000;text-align:center;padding-bottom:40px}
.logo-img{width:90px;height:90px;border-radius:50%;border:4px solid white;object-fit:cover;margin:10px auto;background:#fff}
h1{font-family:'Montserrat';font-size:42px;color:white;text-shadow:3px 3px 6px #000}
.nav-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:15px}
.nav-btn{background:#FFFEF7;color:#000;border:none;padding:12px 18px;border-radius:25px;font-weight:800;cursor:pointer}
.nav-btn.orange{background:#FF6B00;color:white}
.container{padding:10px;max-width:900px;margin:auto}
.page{display:none}.page.active{display:block}
.card{background:white;padding:18px;border-radius:15px;margin:15px auto;text-align:left;max-width:900px}
.big-btn{display:block;padding:18px;margin:12px auto;border-radius:15px;font-weight:800;text-decoration:none;font-size:17px;max-width:600px;color:white;cursor:pointer}
.btn-video{background:#333;border:2px solid #FFD700;color:#FFD700}
.locked{background:#555;cursor:not-allowed}
.buy-btn{background:#00A651;color:white;border:none;padding:14px;width:100%;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div style="padding:20px">
<img id="site-logo" src="https://i.imgur.com/ZxB3Q9L.png" class="logo-img" onclick="showPage('home')">
<h1>ZIMCONNECT</h1>
<div class="nav-grid">
<button class="nav-btn" onclick="showPage('home')">Home</button>
<button class="nav-btn" onclick="showPage('radio')">Radio</button>
<button class="nav-btn" onclick="showPage('tv')">TV</button>
<button class="nav-btn" onclick="showPage('videos')">Video Club</button>
<button class="nav-btn" onclick="showPage('jobs')">Jobs</button>
<button class="nav-btn orange" onclick="showPage('membership')">Join $5</button>
<button class="nav-btn" onclick="window.location='admin.html'">Admin</button>
</div>
</div>

<div class="container">
<div id="home" class="page active">
<a onclick="showPage('radio')" class="big-btn" style="background:#004d00">📻 Radio LIVE</a>
<a onclick="showPage('tv')" class="big-btn" style="background:#D21034">📺 ZimConnect TV</a>
<a onclick="showPage('videos')" class="big-btn btn-video" id="videoBtn">🎬 Video Club - Members Only</a>
</div>

<div id="membership" class="page"><button onclick="showPage('home')">← Back</button>
<div class="card"><h2>💎 Join ZimConnect Premium - $5</h2>
<p>Unlock: Video Club Downloads + Upload Videos + Music Downloads</p>
<button class="buy-btn" onclick="joinMember()">Pay $5 with EcoCash</button></div></div>

<div id="videos" class="page"><button onclick="showPage('home')">← Back</button>
<div class="card" id="videoContent">
<h2>🎬 Video Club</h2>
<p id="lockMsg">Join Membership to watch and download videos</p>
<video id="videoPlayer" controls style="width:100%;display:none"></video>
<a id="downloadBtn" style="display:none" class="buy-btn">Download Video</a>
</div></div>

<div id="radio" class="page"><button onclick="showPage('home')">← Back</button>
<div class="card" style="background:#004d00;color:white"><h2>📻 Radio</h2>
<audio id="radioPlayer" controls style="width:100%"></audio></div></div>

<div id="tv" class="page"><button onclick="showPage('home')">← Back</button>
<div class="card"><h2>📺 TV</h2><video id="tvPlayer" controls style="width:100%"></video></div></div>

<div id="jobs" class="page"><button onclick="showPage('home')">← Back</button>
<div class="card"><h2>💼 Free Jobs</h2><div id="jobs-list"></div></div></div>
</div>

<script>
let isMember = localStorage.getItem("zim_member") === "true";

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  loadMedia();
  if(id==='videos') checkMembership();
}

function joinMember(){
  localStorage.setItem("zim_member","true"); 
  alert("Welcome Member! $5 Paid"); 
  showPage('videos');
  document.getElementById("videoBtn").innerText = "🎬 Video Club - ACCESS GRANTED";
}

function checkMembership(){
  if(isMember){
    document.getElementById("lockMsg").style.display="none";
    document.getElementById("videoPlayer").style.display="block";
    document.getElementById("downloadBtn").style.display="block";
  } else {
    document.getElementById("lockMsg").innerText="🔒 Join $5 Membership to unlock downloads and uploads";
  }
}

function loadMedia(){
  let video = localStorage.getItem("zim_video");
  let audio = localStorage.getItem("zim_audio");
  let image = localStorage.getItem("zim_image");
  if(video){ document.getElementById("videoPlayer").src = video; document.getElementById("tvPlayer").src = video; document.getElementById("downloadBtn").href = video; }
  if(audio){ document.getElementById("radioPlayer").src = audio; }
  if(image){ document.getElementById("site-logo").src = image; }
  
  let jobs = JSON.parse(localStorage.getItem("zim_jobs")||"[]");
  document.getElementById("jobs-list").innerHTML = jobs.map(j=>`<div class="card"><h3>${j.title}</h3><p>${j.company} - ${j.location}</p><p>${j.desc}</p></div>`).join('') || "No jobs yet";
}
window.onload = loadMedia;
</script>
</body></html>
