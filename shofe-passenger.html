<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Request Shofe | ZimConnect</title>
<style>
body{margin:0;font-family:Arial;background:#f4f5f7}
.header{background:linear-gradient(110deg,#006400 0%,#f7a800 50%,#d71920 100%);color:#fff;padding:20px;text-align:center}
.card{background:#fff;margin:15px;padding:15px;border-radius:12px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.btn{width:100%;padding:16px;background:#006400;color:#fff;border:0;border-radius:10px;font-weight:bold;font-size:18px}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px;border:2px solid #006400;border-radius:8px;text-align:center;cursor:pointer}
.tab.active{background:#006400;color:#fff}
</style>
</head>
<body>

<div class="header">
  <img src="assets/shofe-logo.png" style="width:50px;border-radius:10px">
  <h1>REQUEST A SHOFE</h1>
</div>

<div class="card">
  <h3>Select Service</h3>
  <div class="tabs">
    <div class="tab active" onclick="selectTab(this,'city')">City Ride</div>
    <div class="tab" onclick="selectTab(this,'long')">City-City</div>
    <div class="tab" onclick="selectTab(this,'courier')">Courier</div>
  </div>
</div>

<div class="card">
  <h3>Trip Details</h3>
  <input id="pickup" placeholder="📍 Pickup Location">
  <input id="dropoff" placeholder="🏁 Dropoff Location">
  <select id="carType">
    <option>Economy - $</option>
    <option>Comfort - $$</option>
    <option>Van - $$$</option>
  </select>
  <button class="btn" onclick="requestRide()">REQUEST SHOFE NOW</button>
  <p id="rideStatus"></p>
</div>

<div class="card">
  <h3>Download Driver App</h3>
  <p>Are you a driver? Earn money today</p>
  <a href="https://zimconnect.github.io/shofe-rider/" class="btn" style="background:#ff9800;color:#111;text-decoration:none;display:block;text-align:center">BECOME A DRIVER</a>
</div>

<a href="index.html" style="display:block;text-align:center;margin:15px">⬅️ Back to ZimConnect</a>

<script>
let service = 'city';
function selectTab(el, type){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  service = type;
}
function requestRide(){
  const pickup = document.getElementById('pickup').value;
  const dropoff = document.getElementById('dropoff').value;
  if(!pickup || !dropoff){ alert("Enter pickup and dropoff"); return; }
  document.getElementById('rideStatus').innerText = "🔍 Finding nearest Shofe driver for " + service + "...";
  document.getElementById('rideStatus').style.color = "#006400";
  // Here we will connect to Firebase to send request to drivers
  setTimeout(()=>{ alert("Driver found! ETA 4 mins") }, 2000);
}
</script>
</body>
</html>
