<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - ZimConnect</title>
  <link rel="icon" href="icon-512.png" type="image/png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:#000;color:#fff;padding:20px 20px 80px 20px}
    header{background:linear-gradient(90deg,#FF0000,#006400);color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0}
    header img{width:30px;height:30px;border-radius:8px}
    .card{background:#111;margin:15px 0;padding:15px;border-radius:12px;border:1px solid #333}
    .btn{background:linear-gradient(90deg,#FF0000,#006400);color:#fff;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
    input{width:100%;padding:10px;margin:5px 0;background:#222;border:1px solid #444;border-radius:6px;color:#fff}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);padding:20px;z-index:20}
    .modal.active{display:block}
    nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #FFD700}
    nav a{color:#aaa;text-decoration:none;font-size:11px;text-align:center}
    nav a.active{color:#FFD700}
  </style>
</head>
<body>
  <header><img src="icon-512.png"> ZIMCONNECT EVENTS</header>
  <div id="eventsList"><p style="text-align:center;color:#aaa">Loading events...</p></div>
  <button class="btn" onclick="document.getElementById('eventModal').classList.add('active')">+ Post Event</button>

  <div id="eventModal" class="modal">
    <h2 style="color:#FFD700">Post Event</h2>
    <input id="eName" placeholder="Event Name">
    <input id="eDate" type="date">
    <input id="eLocation" placeholder="Venue e.g Harare Gardens">
    <input id="ePrice" placeholder="Ticket Price e.g $10">
    <button class="btn" onclick="postEvent()">Post Event</button>
    <button class="btn" style="background:#333;color:#fff" onclick="document.getElementById('eventModal').classList.remove('active')">Cancel</button>
  </div>

  <nav>
    <a href="index.html">🏠<br>Home</a>
    <a href="jobs.html">💼<br>Jobs</a>
    <a href="events.html" class="active">📅<br>Events</a>
    <a href="tv.html">📺<br>TV</a>
    <a href="podcast.html">🎙️<br>Podcast</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrC2Q1hKYOhXxXNWRq-XbNqN3r-u7L6BY",
      authDomain: "zimconnect-54b36.firebaseapp.com",
      projectId: "zimconnect-54b36",
      storageBucket: "zimconnect-54b36.firebasestorage.app",
      messagingSenderId: "975076570057",
      appId: "1:975076570057:web:26fb478bd26a5b1ea76e18",
      measurementId: "G-CGV55JDX7T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadEvents(){
      const q = query(collection(db, "events"), orderBy("created", "desc"));
      const snap = await getDocs(q);
      let html = "<h2 style='color:#FFD700;margin-bottom:15px'>Upcoming Events</h2>";
      if(snap.empty) html += "<p style='color:#aaa'>No events yet.</p>";
      snap.forEach(doc => {
        const e = doc.data();
        html += `<div class="card"><h3>${e.name}</h3><p>📅 ${e.date}</p><p>📍 ${e.location}</p><p style="color:#FFD700">🎟️ ${e.price}</p></div>`;
      });
      document.getElementById("eventsList").innerHTML = html;
    }
    loadEvents();

    window.postEvent = async function(){
      await addDoc(collection(db, "events"), {
        name: eName.value, date: eDate.value, location: eLocation.value,
        price: ePrice.value, created: new Date()
      });
      alert("Event Posted!");
      document.getElementById('eventModal').classList.remove('active');
      loadEvents();
    }
  </script>
</body>
</html>
