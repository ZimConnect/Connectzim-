<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZimConnect Store</title>
<style>
body { background: #000; color: white; font-family: Arial; margin: 0; padding: 20px; }
h1 { color: #FFD700; }
.product { background: #111; padding: 15px; margin: 10px 0; border-radius: 10px; }
.product img { width: 100%; max-width: 300px; border-radius: 8px; }
button { background: #FFD700; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
input, textarea { width: 95%; padding: 8px; margin: 5px 0; border-radius: 5px; border: none; }
#addForm { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>

<h1>ZimConnect Store</h1>
<button onclick="document.getElementById('addForm').style.display='block'">+ Add Product</button>

<div id="addForm">
  <h3>Add New Product</h3>
  <input id="pName" placeholder="Product Name">
  <input id="pPrice" placeholder="Price" type="number">
  <input id="pImage" placeholder="Image URL - paste link here">
  <textarea id="pDesc" placeholder="Description"></textarea>
  <button onclick="addProduct()">Save Product</button>
</div>

<div id="products"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC...", // REPLACE THIS WITH YOURS
    authDomain: "zimconnect.firebaseapp.com",
    projectId: "zimconnect",
    storageBucket: "zimconnect.appspot.com",
    messagingSenderId: "123...",
    appId: "1:123..."
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadProducts() {
    const querySnapshot = await getDocs(collection(db, "products"));
    let html = "";
    querySnapshot.forEach((doc) => {
      const p = doc.data();
      html += `<div class="product">
        <img src="${p.image}">
        <h2>${p.name}</h2>
        <p>$${p.price}</p>
        <p>${p.desc}</p>
        <button>Buy</button>
      </div>`;
    });
    document.getElementById("products").innerHTML = html;
  }

  window.addProduct = async function() {
    await addDoc(collection(db, "products"), {
      name: document.getElementById("pName").value,
      price: document.getElementById("pPrice").value,
      image: document.getElementById("pImage").value,
      desc: document.getElementById("pDesc").value
    });
    alert("Product Added!");
    loadProducts();
  }

  loadProducts();
</script>
</body>
</html>
