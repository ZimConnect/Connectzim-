<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZimConnect Store</title>
  <link rel="icon" href="icon-512.png" type="image/png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:#000;color:#fff;padding-bottom:80px}
    header{background:linear-gradient(90deg,#FF0000,#006400,#FFD700);color:#000;padding:15px;text-align:center;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
    header img{width:30px;height:30px;border-radius:8px}
    .container{padding:20px;max-width:1000px;margin:auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
    .card{background:#111;padding:15px;border-radius:12px;border:1px solid #333;text-align:center}
    .card img{width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:10px;background:#222}
    .price{color:#FFD700;font-size:20px;font-weight:bold}
    .btn{background:linear-gradient(90deg,#FFD700,#FF0000);color:#000;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
    input,textarea{width:100%;padding:10px;margin:5px 0;background:#222;border:1px solid #444;border-radius:6px;color:#fff}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);padding:20px;overflow-y:auto;z-index:20}
    .modal.active{display:block}
    nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #FFD700}
    nav a{color:#aaa;text-decoration:none;font-size:11px;text-align:center}
    nav a.active{color:#FFD700}
  </style>
</head>
<body>
  <header><img src="icon-512.png"> ZIMCONNECT STORE</header>

  <div class="container">
    <button class="btn" onclick="document.getElementById('productModal').classList.add('active')">+ Add Product</button>
    <div id="productsGrid" class="grid" style="margin-top:15px"></div>
  </div>

  <!-- ADD PRODUCT MODAL -->
  <div id="productModal" class="modal">
    <h2 style="color:#FFD700">Add Product</h2>
    <input id="pName" placeholder="Product Name">
    <input id="pPrice" placeholder="Price e.g 25">
    <input id="pImage" placeholder="Image URL">
    <textarea id="pDesc" placeholder="Description"></textarea>
    <button class="btn" onclick="addProduct()">Save Product</button>
    <button class="btn" style="background:#333;color:#fff" onclick="document.getElementById('productModal').classList.remove('active')">Cancel</button>
  </div>

  <nav>
    <a href="index.html">🏠<br>Home</a>
    <a href="store.html" class="active">🛍️<br>Store</a>
    <a href="jobs.html">💼<br>Jobs</a>
    <a href="tv.html">📺<br>TV</a
