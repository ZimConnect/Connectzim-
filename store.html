<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZimConnect - Store, Travel & Radio</title>
<style>
body { background: #000; color: white; font-family: Arial; margin: 0; padding: 20px; }
h1 { color: #FFD700; text-align: center; }
h1 span { color: #D21034; }
.tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { background: #222; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: 2px solid #333; }
.tab.active { background: #FFD700; color: black; font-weight: bold; }
.tab.radio { background: #004d00; color: #FFD700; }
.card { background: #111; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #333; max-width: 600px; margin: 15px auto; }
.card img { width: 100%; max-width: 400px; border-radius: 8px; display: block; margin: auto; }
.card h2 { color: #FFD700; margin: 10px 0 5px; }
button { background: #FFD700; color: black; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
button.ecocash { background: #00A651; color: white; }
input, textarea { width: 95%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; background: #333; color: white; }
.form { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; max-width: 600px; margin: 20px auto; }
#radioPlayer { width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<h1>Zim<span>Connect</span> 💎</h1>

<div class="tabs">
  <div class="tab radio active" onclick="showTab(event, 'radio')">📻 Radio 263</div>
  <div class="tab" onclick="showTab(event, 'store')">💎 Street Gear Store</div>
  <div class="tab" onclick="showTab(event, 'flights')">✈️ Flights</div>
  <div class="tab" onclick="showTab(event, 'tours')">🚌 Tours</div>
  <div class="tab" onclick="showTab(event, 'resorts')">🏨 Resorts</div>
</div>

<!-- RADIO SECTION -->
<div id="radio">
  <div class="card" style="background:#004d00; border:2px solid #FFD700; text-align:center;">
    <h2 style="color:#FFD700;">ZimConnect Radio 263</h2>
    <h3>Hosted by DJ Tewe 🔥</h3>
    <p>🔴 LIVE NOW: Street Gear Sessions</p>
    <audio id="radioPlayer" controls>
      <source src="https://stream.zeno.fm/0r0a792kwzshx" type="audio/mpeg">
      Your browser does not support audio
    </audio>
    <p style="font-size:12px; opacity:0.7;">Powered by ZimConnect</p>
  </div>
</div>

<!-- STORE SECTION -->
<div id="store" style="display:none">
  <button onclick="showForm('storeForm')">+ Add Product</button>
  <div id="storeForm" class="form">
    <h3>Add Street Gear Product</h3>
    <input id="pName" placeholder="Product Name e.g. Blingberry Hoodie">
    <input id="pPrice" placeholder="Price $" type="number">
    <input id="pImage" placeholder="Image URL">
    <textarea id="pDesc" placeholder="Description"></textarea>
    <button onclick="addItem('products')">Save Product</button>
  </div>
  <div id="productsList"></div>
</div>

<!-- FLIGHTS SECTION -->
<div id="flights" style="display:none">
  <button onclick="showForm('flightForm')">+ Add Flight</button>
  <div id="flightForm" class="form">
    <h3>Add Flight</h3>
    <input id="fFrom" placeholder="From e.g. Harare">
    <input id="fTo" placeholder="To e.g. Victoria Falls">
    <input id="fDate" placeholder="Date" type="date">
    <input id="fPrice" placeholder="Price $" type="number">
    <input id="fAirline" placeholder="Airline e.g. Air Zimbabwe">
    <button onclick="addItem('flights')">Save Flight</button>
  </div>
  <div id="flightsList"></div>
</div>

<!-- TOURS SECTION -->
<div id="tours" style="display:none">
  <button onclick="showForm('tourForm')">+ Add Tour</button>
  <div id="tourForm" class="form">
    <h3>Add Tour/Excursion</h3>
    <input id="tName" placeholder="Tour Name e.g. Vic Falls Tour">
    <input id="tLocation" placeholder="Location">
    <input id="tDate" placeholder="Date" type="date">
    <input id="tPrice" placeholder="Price $" type="number">
    <input id="tImage" placeholder="Image URL">
    <button onclick="addItem('tours')">Save Tour</button>
  </div>
  <div id="toursList"></div>
</div>

<!-- RESORTS SECTION -->
<div id="resorts" style="display:none">
  <button onclick="showForm('resortForm')">+ Add Resort</button>
  <div id="resortForm" class="form">
    <h3>Add Resort/Hotel</h3>
    <input id="rName" placeholder="Resort Name">
    <input id="rLocation" placeholder="Location">
    <input id="rPrice" placeholder="Price per night $" type="number">
    <input id="rImage" placeholder="Image URL">
    <textarea id="rDesc" placeholder="Description"></textarea>
    <button onclick="addItem('resorts')">Save Resort</button>
  </div>
  <div id="resortsList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrC2Q1hKYOhXxXNWRq-XbNqN3r-u7L6BY",
    authDomain: "zimconnect-54b36.firebaseapp.com",
    projectId: "zimconnect-54b36",
    storageBucket: "zimconnect-54b36.firebasestorage.app",
    messagingSenderId: "975076570057",
    appId: "1:975076570057:web:26fb478bd26a5b1ea76e18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // FIX 1: Added 'e' parameter so tabs work
  window.showTab = function(e, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('#radio, #store, #flights, #tours, #resorts').forEach(s => s.style.display='none');
    document.getElementById(tab).style.display='block';
    loadAll();
  }

  window.showForm = function(id) {
    document.getElementById(id).style.display = document.getElementById(id).style.display === 'block' ? 'none' : 'block';
  }

  async function loadAll() {
    await loadCollection('products', 'productsList', renderProduct);
    await loadCollection('flights', 'flightsList', renderFlight);
    await loadCollection('tours', 'toursList', renderTour);
    await loadCollection('resorts', 'resortsList', renderResort);
  }

  async function loadCollection(col, listId, renderFn) {
    const q = query(collection(db, col), orderBy("created", "desc"));
    const snap = await getDocs(q);
    let html = snap.empty ? "<p>No items yet. Add the first one!</p>" : "";
    snap.forEach(doc => html += renderFn(doc.data()));
    document.getElementById(listId).innerHTML = html;
  }

  function renderProduct(p) {
    return `<div class="card"><img src="${p.image}"><h2>${p.name}</h2><p><b>$${p.price}</b></p><p>${p.desc}</p><button class="ecocash" onclick="alert('Coming Soon: Pay with EcoCash for ${p.name}')">💚 Buy with EcoCash</button></div>`;
  }
  function renderFlight(f) {
    return `<div class="card"><h2>${f.from} → ${f.to}</h2><p><b>${f.airline}</b></p><p>Date: ${f.date}</p><p><b>$${f.price}</b></p><button onclick="alert('Book flight to ${f.to}')">Book Flight</button></div>`;
  }
  function renderTour(t) {
    // FIX 2: Changed p.price to t.price
    return `<div class="card"><img src="${t.image}"><h2>${t.name}</h2><p>Location: ${t.location}</p><p>Date: ${t.date}</p><p><b>$${t.price}</b></p><button onclick="alert('Book ${t.name}')">Book Tour</button></div>`;
  }
  function renderResort(r) {
    return `<div class="card"><img src="${r.image}"><h2>${r.name}</h2><p>Location: ${r.location}</p><p>${r.desc}</p><p><b>$${r.price}/night</b></p><button onclick="alert('Book ${r.name}')">Book Stay</button></div>`;
  }

  window.addItem = async function(col) {
    let data = {created: new Date()};
    if(col==='products') data = {...data, name:pName.value, price:pPrice.value, image:pImage.value, desc:pDesc.value};
    if(col==='flights') data = {...data, from:fFrom.value, to:fTo.value, date:fDate.value, price:fPrice.value, airline:fAirline.value};
    if(col==='tours') data = {...data, name:tName.value, location:tLocation.value, date:tDate.value, price:tPrice.value, image:tImage.value};
    if(col==='resorts') data = {...data, name:rName.value, location:rLocation.value, price:rPrice.value, image:rImage.value, desc:rDesc.value};
    
    await addDoc(collection(db, col), data);
    alert("Added Successfully!");
    document.querySelectorAll('.form').forEach(f => f.style.display='none');
    loadAll();
  }

  loadAll();
</script>
</body>
</html>
