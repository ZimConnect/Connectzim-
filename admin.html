<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZimConnect Admin - DJ Tewe</title>
<style>
body{font-family:Arial;background:#111;color:#FFD700;padding:20px}
.card{background:#222;padding:15px;border-radius:8px;margin-bottom:15px}
input,textarea{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:none}
button{background:#00A651;color:white;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer}
h2{color:#D21034}
#login-box{background:#000;border:2px solid #FFD700;padding:20px;border-radius:10px;max-width:400px;margin:100px auto;text-align:center}
#admin-panel{display:none}
.error{color:#D21034}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-box">
<h1>🦅 ZimConnect Admin</h1>
<h2 style="color:#FFD700">Enter Password</h2>
<input id="admin-password" type="password" placeholder="Enter Admin Password">
<button onclick="checkPassword()">Login</button>
<p id="login-error" class="error"></p>
</div>

<!-- ADMIN PANEL - HIDDEN UNTIL LOGIN -->
<div id="admin-panel">

<h1>🦅 ZimConnect Admin Panel</h1>
<p>Welcome DJ Tewe. Add content here. It appears on website instantly</p>
<button style="background:#D21034;margin-bottom:20px" onclick="logout()">Logout</button>

<!-- ADD EVENT -->
<div class="card">
<h2>🎟️ Add Event</h2>
<input id="event-title" placeholder="Event Name: Street Gear Braai">
<input id="event-date" type="date">
<input id="event-place" placeholder="Location: Borrowdale">
<input id="event-price" type="number" placeholder="Price: 10">
<button onclick="saveEvent()">Save Event</button>
</div>

<!-- ADD JOB -->
<div class="card">
<h2>💼 Add Job</h2>
<input id="job-title" placeholder="Job Title: DJ">
<input id="job-company" placeholder="Company: ZimConnect">
<button onclick="saveJob()">Save Job</button>
</div>

<!-- ADD PRODUCT -->
<div class="card">
<h2>💎 Add Product</h2>
<input id="prod-name" placeholder="Product: Blingberry Hoodie">
<input id="prod-price" type="number" placeholder="Price: 45">
<button onclick="saveProduct()">Save Product</button>
</div>

<!-- ADD PODCAST -->
<div class="card">
<h2>🎙️ Add Podcast Episode</h2>
<input id="pod-title" placeholder="Episode Title: The Movement">
<input id="pod-link" placeholder="Audio Link mp3">
<button onclick="savePodcast()">Save Podcast</button>
</div>

<button style="background:#D21034" onclick="clearAll()">🗑️ Clear All Data</button>
<br><br><a href="index.html" style="color:#FFD700">← Back to Website</a>

</div>

<script>
const ADMIN_PASSWORD = "Tewe263"; // <-- CHANGE YOUR PASSWORD HERE

// CHECK IF ALREADY LOGGED IN
if(localStorage.getItem("zim_admin_loggedin") === "true"){
  showPanel();
}

function checkPassword(){
  let pass = document.getElementById("admin-password").value;
  if(pass === ADMIN_PASSWORD){
    localStorage.setItem("zim_admin_loggedin", "true");
    showPanel();
  } else {
    document.getElementById("login-error").innerText = "Wrong Password!";
  }
}

function showPanel(){
  document.getElementById("login-box").style.display = "none";
  document.getElementById("admin-panel").style.display = "block";
}

function logout(){
  localStorage.removeItem("zim_admin_loggedin");
  location.reload();
}

function saveEvent(){
let events = JSON.parse(localStorage.getItem("zim_events")||"[]");
events.push({title:document.getElementById("event-title").value, date:document.getElementById("event-date").value, place:document.getElementById("event-place").value, price:document.getElementById("event-price").value});
localStorage.setItem("zim_events", JSON.stringify(events));
alert("Event Saved! Go to website to see it");
}
function saveJob(){
let jobs = JSON.parse(localStorage.getItem("zim_jobs")||"[]");
jobs.push({title:document.getElementById("job-title").value, company:document.getElementById("job-company").value});
localStorage.setItem("zim_jobs", JSON.stringify(jobs));
alert("Job Saved!");
}
function saveProduct(){
let prods = JSON.parse(localStorage.getItem("zim_products")||"[]");
prods.push({name:document.getElementById("prod-name").value, price:document.getElementById("prod-price").value});
localStorage.setItem("zim_products", JSON.stringify(prods));
alert("Product Saved!");
}
function savePodcast(){
let pods = JSON.parse(localStorage.getItem("zim_podcasts")||"[]");
pods.push({title:document.getElementById("pod-title").value, link:document.getElementById("pod-link").value});
localStorage.setItem("zim_podcasts", JSON.stringify(pods));
alert("Podcast Saved!");
}
function clearAll(){
if(confirm("Delete all events, jobs, products?")){
localStorage.clear(); 
localStorage.setItem("zim_admin_loggedin", "true"); // keep you logged in
alert("All data cleared");
}}
</script>
</body></html>
